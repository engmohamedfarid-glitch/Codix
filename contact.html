<!DOCTYPE html>
<html lang="en">
 <head>
  <!-- CODI.X | صفحة التواصل | HTML: عناصر الصفحة ومحتواها، CSS في contact.css، JavaScript في contact.js -->
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#08080c" name="theme-color"/>
  <meta content="CODI.X — Tech education, software solutions and creative business teams from Sohag, Egypt." name="description"/>
  <title>
   Contact | CODI.X
  </title>
  <link href="contact.css" rel="stylesheet"/>
 </head>
 <body data-page="contact">
  <!-- محتوى الصفحة: يمكن تعديل النصوص والعناوين والروابط هنا. بعض العناصر يتم توليدها من ملف JavaScript. -->
  <div id="header">
  </div>
  <main class="wrap">
   <div class="page-head reveal">
    <span class="eyebrow">
     Let's connect
    </span>
    <h1>
     LET'S BUILD
     <br/>
     <em>
      SOMETHING.
     </em>
    </h1>
    <p>
     Learning, projects, partnerships or joining the community — start the conversation.
    </p>
   </div>
   <section style="padding-top:20px">
    <div class="split">
     <div>
      <div class="card">
       <span class="number">
        BASED IN
       </span>
       <h3>
        Sohag, Egypt
       </h3>
       <p>
        Rooted in Sohag. Building beyond borders.
       </p>
      </div>
      <div class="card" style="margin-top:18px">
       <span class="number">
        OUR COMMUNITY
       </span>
       <h3>
        Join CODI.X
       </h3>
       <p>
        Interested in becoming part of the journey?
       </p>
       <a class="btn outline" href="https://docs.google.com/forms/d/e/1FAIpQLSdBgInGdQIiGSuoM44EMGRR2yFNvLXsZLq3pInf_pi9yedqsQ/viewform" rel="noopener" target="_blank">
        Recruitment Form ↗
       </a>
      </div>
     </div>
     <form class="form-card" id="contact-form">
      <div class="field">
       <label>
        Your Name
       </label>
       <input name="name" placeholder="Full name" required=""/>
      </div>
      <div class="field">
       <label>
        I'm interested in
       </label>
       <select name="interest">
        <option>
         CODI.X Academy
        </option>
        <option>
         Software Development
        </option>
        <option>
         Business Teams
        </option>
        <option>
         Partnership
        </option>
        <option>
         Other
        </option>
       </select>
      </div>
      <div class="field">
       <label>
        Message
       </label>
       <textarea name="message" placeholder="Tell us about your idea..." required=""></textarea>
      </div>
      <button class="btn" type="submit">
       Continue on WhatsApp ↗
      </button>
      <p class="tiny">
      
      </p>
     </form>
    </div>
   </section>
  </main>
  <div id="footer">
  </div>
  <script src="contact.js">
  </script>
 </body>
</html>
